<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Somewhere Coffee Shop - fresh coffee, pastries and a place to relax."
    />
    <title>Contact us | Somewhere Coffee Shop</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div class="site">
      <div class="appearance-controls" aria-label="Tùy chỉnh giao diện"><div class="theme-buttons" role="group" aria-label="Chọn theme"><button type="button" data-theme="gold">Nâu vàng</button><button type="button" data-theme="green">Xanh lá</button><button type="button" data-theme="rose">Đỏ hồng</button></div><label>Màu nền <select id="background-tone"><option value="light">Light Brown</option><option value="native" selected>Native Brown</option><option value="dark">Dark Brown</option></select></label></div>
      <header>
        <div class="hero" aria-label="Coffee shop slideshow">
          <img
            id="slide-image"
            src="images/banner.jpg"
            alt="The welcoming exterior of our coffee shop"
          />
          <span class="slide-count" id="slide-count">1 / 3</span>
          <button class="arrow prev" type="button" aria-label="Previous slide">
            &#10094;
          </button>
          <button class="arrow next" type="button" aria-label="Next slide">
            &#10095;
          </button>
          <div class="caption" id="slide-caption">
            Welcome To Our Coffee Shop
          </div>
        </div>
        <div class="masthead">
          <div class="dots">
            <button
              class="dot"
              data-slide="0"
              aria-label="Show slide 1"
              aria-current="true"
            ></button>
            <button
              class="dot"
              data-slide="1"
              aria-label="Show slide 2"
              aria-current="false"
            ></button>
            <button
              class="dot"
              data-slide="2"
              aria-label="Show slide 3"
              aria-current="false"
            ></button>
            <button class="pause" type="button" aria-label="Pause slideshow">
              Pause
            </button>
          </div>
          <a class="brand" href="home.html">Somewhere Coffee Shop</a>
        </div>
      </header>
      <div class="layout">
        <aside class="sidebar">
          <nav class="nav" aria-label="Main navigation">
            <a href="home.html">Home</a>
            <a href="about.html">About</a>
            <a href="location.html">Location</a>
            <a href="menu.html">Menu</a>
            <a href="contact.html" aria-current="page">Contact</a>
          </nav>
          <img
            class="cup"
            src="images/coffee_cup.jpg"
            alt=""
            width="304"
            height="425"
          />
        </aside>
        <main id="main">
          <h1>Contact us</h1>
          <p>
            <strong>
              Thank you for your interest. Please send us comments using the
              form below:
            </strong>
          </p>
          <form class="contact-form">
            <div class="field">
              <label for="firstName">FirstName</label>
              <input
                id="firstName"
                name="firstName"
                autocomplete="given-name"
                required
                maxlength="80"
              />
            </div>
            <div class="field">
              <label for="lastName">LastName</label>
              <input
                id="lastName"
                name="lastName"
                autocomplete="family-name"
                required
                maxlength="80"
              />
            </div>
            <div class="field">
              <label for="phone">Phone</label>
              <input
                id="phone"
                name="phone"
                type="tel"
                autocomplete="tel"
                maxlength="30"
              />
            </div>
            <div class="field">
              <label for="email">Email</label>
              <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                required
                maxlength="150"
              />
            </div>
            <div class="field">
              <label for="comments">Comments</label>
              <textarea
                id="comments"
                name="comments"
                required
                maxlength="3000"
              ></textarea>
            </div>
            <div class="form-actions">
              <label class="check">
                <input type="checkbox" name="newsletter" />
                Send me your monthly newsletter
              </label>
              <button class="button" type="submit">Submit</button>
              <p class="status" id="contact-status" role="status"></p>
            </div>
          </form>
        </main>
      </div>
      <footer class="footer">
        <div>
          <a href="location.html#hours">Hours</a>
          |
          <a href="home.html#news">News</a>
          |
          <a href="menu.html">Products</a>
          |
          <a href="location.html#delivery">Services</a>
          |
          <a href="contact.html">Survey &amp; Feedback</a>
        </div>
        <span>&copy; 2022</span>
      </footer>
    </div>
    <div class="flakes" aria-hidden="true">
      <span>&#10052;</span>
      <span>&#10052;</span>
      <span>&#10052;</span>
      <span>&#10052;</span>
    </div>
  </body>
</html>
